name: Game tests

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-test:
    name: Dedicated server game tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the in-game assertions
        run: ./gradlew gameTestServer --stacktrace

      - name: Verify the success marker
        # The Gradle task itself exits non-zero on failure; this also makes a
        # silently missing/empty run fail loudly. FML writes more than latest.log.
        if: always()
        run: |
          test -n "$(ls run/server/logs/*.log 2>/dev/null)" || { echo "no server log was written"; exit 1; }
          grep -hE "AETHER-GAMETEST\] [0-9]+/[0-9]+ checks passed" run/server/logs/*.log || true
          grep -hq "AETHER_GAMETEST_OK" run/server/logs/*.log
          ! grep -hq "AETHER_GAMETEST_FAILED" run/server/logs/*.log

      - name: Upload the game-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-game-test-log
          path: run/server/logs/
          if-no-files-found: warn
